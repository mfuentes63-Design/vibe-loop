# Vibe Loop - Windows build, dependency audit and TEST package.
#
# Proves: the Release|x64 solution restores and compiles on a clean Windows runner; the dependency audit
# result; and that a complete portable test layout (core, UI, players, watchdog, screensaver launcher,
# pinned third-party runtimes, notices) can be assembled and verified.
# Does NOT prove: that Vibe Loop runs. Nothing is executed here. The package is labelled
# NOT-RUNTIME-VERIFIED until docs/vibe-loop/WINDOWS_RUNTIME_TEST_PLAN.md has been completed on Windows.

name: Windows build, audit & test package

on:
  push:
    branches:
      - "feat/**"
      - "dev/**"
  pull_request:
    branches:
      - "dev/personal-screensaver"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: src/Lively/VibeLoop.sln
  CONFIGURATION: Release
  PLATFORM: x64
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Compile, audit, package (Release x64)
    # Same toolset family as the owner's local Visual Studio 2022 build.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild (Visual Studio 2022)
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache pinned third-party downloads
        uses: actions/cache@v4
        with:
          path: artifacts/downloads
          key: thirdparty-${{ hashFiles('build/package/third-party-runtimes.json') }}

      - name: Identity guard (no upstream runtime identifiers)
        shell: pwsh
        run: |
          # Fails if the upstream single-instance mutex or installer AppId is used as a value anywhere in source.
          $patterns = @('"LIVELY:DESKTOPWALLPAPERSYSTEM"', 'AppMutex=LIVELY:', 'AppId={{E3E43E1B', '"12030rocksdanister.LivelyWallpaper')
          $hits = Get-ChildItem -Path src -Recurse -File -Include *.cs,*.iss,*.appxmanifest,*.csproj |
            Select-String -SimpleMatch -Pattern $patterns
          if ($hits) { $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::Upstream identifier: $($_.Line.Trim())" }; exit 1 }
          Write-Host "No upstream runtime identifiers found."

      - name: Restore and build (${{ env.CONFIGURATION }}|${{ env.PLATFORM }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null
          msbuild $env:SOLUTION -restore -m -nologo `
            -p:Configuration=$env:CONFIGURATION -p:Platform=$env:PLATFORM `
            -bl:artifacts/logs/build.binlog `
            "-flp:logfile=artifacts/logs/build.log;verbosity=normal" `
            "-flp1:logfile=artifacts/logs/warnings.log;warningsonly" `
            "-flp2:logfile=artifacts/logs/errors.log;errorsonly"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dependency audit (fails on high/critical advisories or downgrades)
        id: audit
        continue-on-error: true   # enforced after the package/log uploads, see last step
        shell: pwsh
        run: pwsh -NoProfile -File build/audit/Invoke-DependencyAudit.ps1 -RestoreLog artifacts/logs/build.log -OutDir artifacts/audit -FailOnSeverity high

      - name: Assemble and verify test package (NOT runtime-verified)
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}   # read-only GitHub API access to resolve pinned third-party release assets
        run: pwsh -NoProfile -File build/package/New-VibeLoopTestPackage.ps1 -OutputDirectory artifacts/package -Configuration $env:CONFIGURATION

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $warn = if (Test-Path artifacts/logs/warnings.log) { Get-Content artifacts/logs/warnings.log } else { @() }
          $err  = if (Test-Path artifacts/logs/errors.log)   { Get-Content artifacts/logs/errors.log }   else { @() }
          @(
            "## Vibe Loop build ($env:CONFIGURATION|$env:PLATFORM)"
            ""
            "- Compile errors: $($err.Count); warning lines: $($warn.Count)"
            "- Dependency audit: **${{ steps.audit.outcome }}** (details above / artifact ``dependency-audit``)"
            "- Test package: **${{ steps.package.outcome }}**"
            ""
            "> The test package is **NOT runtime-verified**. Nothing was executed on this runner."
            "> Follow docs/vibe-loop/WINDOWS_RUNTIME_TEST_PLAN.md in a disposable Windows VM."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: artifacts/logs/
          retention-days: 14

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: artifacts/audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test package (NOT runtime-verified)
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          compression-level: 0
          retention-days: 14

      - name: Enforce dependency audit
        if: always() && steps.audit.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error title=Dependency audit failed::High/critical advisories or package downgrades were found. See the 'dependency-audit' artifact and the job summary."
          exit 1
